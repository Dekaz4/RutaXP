name: RutaXP 1.2.10 public Windows menu 1 (LFG ES)
on:
  push:
    branches: ["codex/qa-1210-live-*"]
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {version: "1.0.2", args: ""}
          - {version: "1.2.9", args: ""}
          - {version: "1.2.9", args: "--locked"}
          - {version: "1.2.10", args: ""}
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lupa
      - name: Run original installer with one line of input
        run: python .github/workflows/fresh_client.py ${{ matrix.version }} ${{ matrix.args }}
