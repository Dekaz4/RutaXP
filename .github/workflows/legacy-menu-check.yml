name: Public launcher option 1
on:
  push:
    branches: ["codex/qa-legacy-menu-*"]
permissions:
  contents: read
jobs:
  live:
    strategy:
      fail-fast: false
      matrix:
        version: ["1.0.2", "1.2.8"]
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install lupa
      - name: Run original installer with one line of input
        run: python .github/scripts/public_menu_checks.py ${{ matrix.version }}
