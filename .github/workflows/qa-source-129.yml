name: RutaXP 1.2.9 Windows build and test
on:
  push:
    branches: ["codex/qa-129-src-*"]
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 50
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: python -m pip install lupa Pillow PyInstaller==6.13.0
      - name: Build public release assets
        run: python -B tools/build_release.py
      - name: Run full unit and Windows integration suite
        run: python -B -m unittest discover -s tests
      - name: Save verified Windows assets
        uses: actions/upload-artifact@v4
        with:
          name: RutaXP-1.2.9-verified
          path: |
            dist/Instalador_RutaXP.exe
            dist/RutaXP-1.2.9.zip
            dist/RutaXP-1.2.9-addon.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 3
