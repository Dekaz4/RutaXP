name: RutaXP 1.2.8 Windows QA
on:
  push:
    branches:
      - 'codex/qa-1-2-8-win-e215be30'
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 55
    env:
      PYTHONUTF8: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install build and test dependencies
        run: python -m pip install lupa Pillow PyInstaller==6.13.0
      - name: Build the public release
        run: python -B tools/build_release.py
      - name: Run full unit and Windows integration suite
        run: python -B -m unittest discover -s tests
